name: Project guide checks
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/PROJECT_GUIDE.md').read_text()
          assert s.count('~~~') % 2 == 0
          assert s.count('~~~mermaid') >= 3
          assert 'docs/PROJECT_GUIDE.md' in Path('README.md').read_text()
          print('Guide checks passed')
          PY
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - run: nuget restore "SPI Data Comp Tool.sln" -NonInteractive
      - name: Build desktop application
        shell: pwsh
        run: msbuild "SPI Data Comp Tool.sln" /m /p:Configuration=Release '/p:Platform=Any CPU'
