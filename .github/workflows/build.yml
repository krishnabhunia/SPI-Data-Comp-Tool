name: Build and checks
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # one release at a time per branch / PR; never cancel a run that may be publishing
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify project documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/PROJECT_GUIDE.md').read_text()
          assert s.count('~~~') % 2 == 0
          assert s.count('~~~mermaid') >= 3
          assert 'docs/PROJECT_GUIDE.md' in Path('README.md').read_text()
          print('Guide checks passed')
          PY

  secrets-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Designer files match their layout specs
        run: python3 tools/layout_gen.py --check tools/layouts/*.py
      - name: Fail if connection profiles or passwords are committed
        run: |
          python - <<'PY'
          import json, re, subprocess, sys
          tracked = subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.splitlines()
          bad = []
          for f in tracked:
              low = f.lower()
              if low.endswith('userprofile/userprofile.json'):
                  bad.append(f'{f}: real profile file is tracked (use userProfile.example.json)')
              if low.endswith('.pfx') or low.endswith('.snk'):
                  bad.append(f'{f}: signing key is tracked')
              if low.endswith('.json'):
                  text = open(f, encoding='utf-8-sig', errors='ignore').read()
                  for m in re.finditer(r'"str_Password"\s*:\s*"([^"]*)"', text):
                      if m.group(1):
                          bad.append(f'{f}: non-empty str_Password')
          src = [f for f in tracked if f.endswith('.cs')]
          for f in src:
              text = open(f, encoding='utf-8-sig', errors='ignore').read()
              for m in re.finditer(r'(?i)(?:password|pwd)\w*\.Text\s*=\s*@?"[^"]+"', text):
                  line = text.count('\n', 0, m.start()) + 1
                  bad.append(f'{f}:{line}: password text box pre-filled with a literal')
              for m in re.finditer(r'(?i)(?:password|pwd)\w*\.Text\s*==\s*@?"[^"]+"', text):
                  line = text.count('\n', 0, m.start()) + 1
                  bad.append(f'{f}:{line}: password compared with a hard-coded literal')
              for m in re.finditer(r'Environment\.UserName(?:\.ToString\(\))?\s*==\s*"(?:\d{5,}|REDACTED[^"]*)"', text):
                  line = text.count('\n', 0, m.start()) + 1
                  bad.append(f'{f}:{line}: access tied to a hard-coded user id')
          # Generic branding: no former-employer names, and only the app's own generated images
          brand = re.compile(r'(?i)\bLT' + r'TS\b|Lars' + r'en|Tou' + r'bro|Tour' + r'bo|L&(?:amp;)?T\b')
          allowed_images = {'SPI Data Comp Tool/app.ico', 'SPI Data Comp Tool/Resources/about_side.png'}
          for f in tracked:
              if re.search(r'(?i)\.(ico|png|jpe?g|gif|bmp|tiff?|svg)$', f) and f not in allowed_images:
                  bad.append(f'{f}: image not generated by tools/make_app_images.py')
              if f.endswith(('.cs', '.resx', '.csproj', '.config', '.settings', '.md', '.json', '.sln', '.txt', '.yml')):
                  text = open(f, encoding='utf-8-sig', errors='ignore').read()
                  for m in brand.finditer(text):
                      line = text.count('\n', 0, m.start()) + 1
                      bad.append(f'{f}:{line}: former-employer branding')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print(f'Secrets guard passed ({len(tracked)} tracked files checked)')
          PY

  version:
    # Works out x.y.z (x major, y minor, z fix) - see tools/release.py and docs/PROJECT_GUIDE.md
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # reserves the beta tag on the PR commit
      pull-requests: read    # finds the merged PR of a push to master
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      head: ${{ steps.plan.outputs.head }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --tags --force origin
      - name: Version unit tests
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - name: Plan version
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py plan --reserve

  windows-build:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: NuGet/setup-nuget@v3
      - uses: microsoft/setup-msbuild@v3
      - name: Stamp version ${{ needs.version.outputs.version }}
        id: ver
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.version }}'
          python tools/release.py stamp $v
          if ($LASTEXITCODE -ne 0) { throw 'stamp failed' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"
      - run: nuget restore "SPI Data Comp Tool.sln" -NonInteractive
      - name: Build desktop application
        shell: pwsh
        run: msbuild "SPI Data Comp Tool.sln" /m /p:Configuration=Release '/p:Platform=Any CPU' /warnaserror
      - name: UI workflow regression checks
        shell: pwsh
        run: |
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $log = Join-Path $PWD 'ui-workflow-checks.txt'
          $p = Start-Process $exe -ArgumentList '--check-ui', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(60000)) { & tools/ci_window_report.ps1 -ProcessId $p.Id; Stop-Process -Id $p.Id -Force; throw 'UI workflow checks timed out' }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw 'UI workflow checks failed' }
      - name: Excel Sheet Audit regression checks
        shell: pwsh
        run: |
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $log = Join-Path $env:RUNNER_TEMP 'excel-audit-checks.txt'
          $p = Start-Process $exe -ArgumentList '--check-excel-audit', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(120000)) { & tools/ci_window_report.ps1 -ProcessId $p.Id; Stop-Process -Id $p.Id -Force; throw 'Excel Sheet Audit checks timed out' }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw 'Excel Sheet Audit checks failed' }
      - name: Updater checks
        shell: pwsh
        run: |
          # the updater's decisions on synthetic data: versions, channels, checksums, portable files (nothing is downloaded)
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $log = Join-Path $env:RUNNER_TEMP 'update-checks.txt'
          $p = Start-Process $exe -ArgumentList '--check-updates', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(60000)) { & tools/ci_window_report.ps1 -ProcessId $p.Id; Stop-Process -Id $p.Id -Force; throw 'updater checks timed out' }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw 'updater checks failed' }
      - name: Input checks
        shell: pwsh
        run: |
          # the shared input checker on a made-up window: required fields, ports, files, names, connections, marks and log
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $log = Join-Path $env:RUNNER_TEMP 'input-checks.txt'
          $p = Start-Process $exe -ArgumentList '--check-inputs', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'input checks timed out' }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw 'input checks failed' }
      - name: Theme checks
        shell: pwsh
        run: |
          # every window in each of the four colour themes: text must stay readable, and the theme must switch while windows are open
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $log = Join-Path $env:RUNNER_TEMP 'theme-checks.txt'
          $p = Start-Process $exe -ArgumentList '--check-themes', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(180000)) { & tools/ci_window_report.ps1 -ProcessId $p.Id; Stop-Process -Id $p.Id -Force; throw 'theme checks timed out' }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw 'theme checks failed' }
      - name: Controlled step checks
        shell: pwsh
        run: |
          # a later step stays locked until the one before is done; an earlier change locks the later steps again
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $log = Join-Path $env:RUNNER_TEMP 'step-checks.txt'
          $p = Start-Process $exe -ArgumentList '--check-steps', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(120000)) { & tools/ci_window_report.ps1 -ProcessId $p.Id; Stop-Process -Id $p.Id -Force; throw 'step checks timed out' }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw 'step checks failed' }
      - name: Group window checks
        shell: pwsh
        run: |
          # grouped-tool routes now use workspaces: retain lazy pages, bounded windows and all-or-none close guards
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $log = Join-Path $env:RUNNER_TEMP 'group-checks.txt'
          $p = Start-Process $exe -ArgumentList '--check-groups', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(120000)) { & tools/ci_window_report.ps1 -ProcessId $p.Id; Stop-Process -Id $p.Id -Force; throw 'group window checks timed out' }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $log)) { throw 'group window checks failed' }
      - name: Open every window
        shell: pwsh
        run: |
          # every window must open: a window that throws while opening fails the build
          $exe = (Resolve-Path "SPI Data Comp Tool/bin/Release/SPI Data Comp Tool.exe").Path
          $list = Join-Path $env:RUNNER_TEMP "forms.txt"
          $log = Join-Path $env:RUNNER_TEMP "open-forms.txt"
          $listing = Start-Process $exe -ArgumentList '--list-forms', "`"$list`"" -Wait -PassThru
          if ($listing.ExitCode -ne 0 -or -not (Test-Path $list)) { throw 'Cannot enumerate forms' }
          $forms = @(Get-Content $list)
          if (-not $forms) { throw 'no window found to open' }
          $failed = @()
          foreach ($f in $forms) {
            $p = Start-Process $exe -ArgumentList '--open-form', $f, "`"$log`"" -PassThru
            if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; $failed += "$f (timed out)"; continue }
            if ($p.ExitCode -ne 0) { $failed += "$f (exit code $($p.ExitCode))" }
          }
          if (Test-Path $log) { Get-Content $log | ForEach-Object { Write-Host $_ } }
          $ok = $forms.Count - $failed.Count
          Write-Host "Opened $ok of $($forms.Count) windows"
          foreach ($x in $failed) { Write-Host "::error::window did not open: $x" }
          if ($failed) { throw "$($failed.Count) window(s) did not open" }
      - name: Package portable build
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $name = "SPI_Data_Comp_Tool_$ver"
          $src = "SPI Data Comp Tool/bin/Release"
          $dst = "dist/portable"
          New-Item -ItemType Directory -Force $dst | Out-Null
          # Portable copy only: skip debug symbols, XML docs and ClickOnce publish output/manifests
          Get-ChildItem $src -File | Where-Object { $_.Extension -notin '.pdb','.xml','.application','.manifest' } |
            Copy-Item -Destination $dst
          # PNID report SQL templates are read at runtime from <exe folder>\PNID_Reports\Source|Target_IPEP
          Copy-Item "$src/PNID_Reports" "$dst/PNID_Reports" -Recurse
          foreach ($t in 'Source/instrument.txt','Target_IPEP/instrument.txt') {
            if (-not (Test-Path "$dst/PNID_Reports/$t")) { throw "PNID template missing from portable/: $t" }
          }
          Rename-Item "$dst/SPI Data Comp Tool.exe" "$name.exe"
          Rename-Item "$dst/SPI Data Comp Tool.exe.config" "$name.exe.config"
          if (Test-Path "$dst/app.publish") { throw 'ClickOnce output leaked into portable/' }
          Get-ChildItem dist -Recurse | ForEach-Object { $_.FullName }
      - name: Portable build is one exe (libraries embedded)
        shell: pwsh
        run: |
          $dlls = Get-ChildItem dist/portable -Recurse -Filter *.dll
          if ($dlls) { $dlls | ForEach-Object { Write-Host "::error::$($_.FullName)" }; throw 'DLL files next to the portable exe' }
          $exe = (Get-ChildItem dist/portable -Filter *.exe).FullName
          $log = Join-Path $env:RUNNER_TEMP 'portable-assemblies.txt'
          $p = Start-Process $exe -ArgumentList '--check-assemblies', "`"$log`"" -Wait -PassThru
          Get-Content $log | ForEach-Object { Write-Host $_ }
          if ($p.ExitCode -ne 0) { throw 'a library failed to load from the portable exe' }
      - name: Build 64-bit application
        shell: pwsh
        run: msbuild "SPI Data Comp Tool.sln" /m /p:Configuration=Release /p:Platform=x64 /warnaserror
      - name: Build 64-bit installer
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $num = ($ver -split '-')[0]
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 (ISCC.exe) not found' }
          $src = (Resolve-Path "SPI Data Comp Tool/bin/x64/Release").Path
          $out = Join-Path $PWD 'dist/windows-x64'
          & $iscc /Qp "/DAppVersion=$ver" "/DNumericVersion=$num" "/DSourceDir=$src" "/DOutputDir=$out" windows/installer/SPI_Data_Comp_Tool.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem $out | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }
      - name: Test the installer (silent install, check, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/windows-x64 -Filter *.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'spi-install'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          $exe = Join-Path $dir 'SPI Data Comp Tool.exe'
          if (-not (Test-Path $exe)) { throw 'installed exe missing' }
          if (-not (Test-Path (Join-Path $dir 'PNID_Reports/Source/instrument.txt'))) { throw 'PNID templates missing from the install' }
          $dlls = Get-ChildItem $dir -Recurse -Filter *.dll
          if ($dlls) { $dlls | ForEach-Object { Write-Host "::error::$($_.FullName)" }; throw 'DLL files in the install folder' }
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3C)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0x8664) { throw ('installed exe is not 64-bit (machine 0x{0:X})' -f $machine) }
          $log = Join-Path $env:RUNNER_TEMP 'x64-assemblies.txt'
          $c = Start-Process $exe -ArgumentList '--check-assemblies', "`"$log`"" -Wait -PassThru
          Get-Content $log | ForEach-Object { Write-Host $_ }
          if ($c.ExitCode -ne 0) { throw 'a library failed to load from the installed 64-bit exe' }
          $uiLog = Join-Path $env:RUNNER_TEMP 'x64-ui-workflow-checks.txt'
          $ui = Start-Process $exe -ArgumentList '--check-ui', "`"$uiLog`"" -PassThru
          if (-not $ui.WaitForExit(60000)) { & tools/ci_window_report.ps1 -ProcessId $ui.Id; Stop-Process -Id $ui.Id -Force; throw '64-bit UI workflow checks timed out' }
          if (Test-Path $uiLog) { Get-Content $uiLog | ForEach-Object { Write-Host $_ } }
          if ($ui.ExitCode -ne 0 -or -not (Test-Path $uiLog)) { throw '64-bit UI workflow checks failed' }
          Get-ChildItem $dir -Recurse -File | ForEach-Object { Write-Host "installed: $($_.FullName.Substring($dir.Length))" }
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'uninstall left the exe behind' }
          Write-Host "64-bit installer: installed, 64-bit exe, no DLL files, libraries load, uninstalled cleanly"
      - uses: actions/upload-artifact@v6
        with:
          name: SPI_Data_Comp_Tool_${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    # PR -> GitHub pre-release vX.Y.Z-betaNNN; merge to master -> GitHub release vX.Y.Z (latest).
    # The version is shown in this check's name and in one comment on the PR - never typed into a PR title.
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, windows-build, documentation, secrets-guard]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write   # keeps the version comment on the PR up to date
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: SPI_Data_Comp_Tool_${{ needs.version.outputs.version }}
          path: dist
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PRE: ${{ needs.version.outputs.prerelease }}
          SHA: ${{ needs.version.outputs.head }}
        run: |
          set -euo pipefail
          if [ "${PRE}" = "true" ]; then
            # A beta must not appear after the normal version with the same number (another PR was
            # merged while this build ran): skip it, the next run gets the next number.
            stable="v${VERSION%%-beta*}"
            if gh api "repos/${GH_REPO}/git/ref/tags/${stable}" >/dev/null 2>&1; then
              echo "state=outdated" >> "$GITHUB_OUTPUT"
              echo "::warning::${stable} is already released, so ${TAG} was not published. Re-run all jobs or push a new commit for the next beta."
              echo "### Not published: ${TAG} (${stable} is already released)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "state=beta" >> "$GITHUB_OUTPUT"
          else
            echo "state=stable" >> "$GITHUB_OUTPUT"
          fi
          zip_name="SPI_Data_Comp_Tool_${VERSION}.zip"
          (cd dist && zip -qr "../${zip_name}" .)
          # the 64-bit installer also goes on the release page by itself, for a one-click download
          setup_name="SPI_Data_Comp_Tool_${VERSION}_x64_setup.exe"
          cp "dist/windows-x64/SPI_Data_Comp_Tool_${VERSION}.exe" "${setup_name}"
          sha256sum "${zip_name}" "${setup_name}" > "${zip_name}.sha256"
          cat "${zip_name}.sha256"
          assets=("${zip_name}" "${zip_name}.sha256" "${setup_name}")
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            flags=(--title "SPI Data Comparison Tool ${VERSION}" --generate-notes --target "${SHA}")
            if [ "${PRE}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "${TAG}" "${assets[@]}" "${flags[@]}"
          fi
          echo "### Released ${TAG}" >> "$GITHUB_STEP_SUMMARY"
      - name: Show the version on the pull request
        if: needs.version.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.version.outputs.pr }}
          TAG: ${{ needs.version.outputs.tag }}
          HEAD_SHA: ${{ needs.version.outputs.head }}
          STATE: ${{ steps.publish.outputs.state }}
        run: |
          set -euo pipefail
          # A PR run that ends (or is re-run) after the PR was merged must not replace "Released as ..."
          # with a beta message: once merged, only the merge build writes the comment.
          if [ "${STATE}" != "stable" ] && [ "$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq .merged)" = "true" ]; then
            echo "PR #${PR} is already merged: its comment is left to the merge build."
            exit 0
          fi
          python3 tools/release.py comment "${STATE}" > "${RUNNER_TEMP}/version-comment.md"
          cat "${RUNNER_TEMP}/version-comment.md" >> "$GITHUB_STEP_SUMMARY"
          # one comment per PR, found by its hidden first line and replaced on every run
          id="$(gh api "repos/${GH_REPO}/issues/${PR}/comments" --paginate \
                --jq '.[] | select(.body | startswith("<!-- spi-version -->")) | .id' | sed -n 1p)"
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${id}" -F "body=@${RUNNER_TEMP}/version-comment.md" --jq .html_url
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR}/comments" -F "body=@${RUNNER_TEMP}/version-comment.md" --jq .html_url
          fi
